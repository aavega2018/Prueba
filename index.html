<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Reserva tu turno - Barbería</title>

<style>
body {
  font-family: 'Arial', sans-serif;
  background: linear-gradient(135deg, #1a1a1a, #2c2c2c);
  padding: 20px;
  color: #fff;
}

/* Contenedor principal */
.form-container {
  background: #ffffff;
  color: #333;
  max-width: 450px;
  margin: auto;
  padding: 25px;
  border-radius: 12px;
  box-shadow: 0 0 25px rgba(0,0,0,0.4);
  border-top: 10px solid #d32f2f;
  border-bottom: 10px solid #1976d2;
}

/* Título */
.form-container h2 {
  text-align: center;
  font-size: 26px;
  margin-bottom: 10px;
  font-weight: bold;
}

/* Icono */
.form-container .icon {
  text-align: center;
  margin-bottom: 15px;
}

.form-container .icon img {
  width: 80px;
}

/* Inputs */
input, select {
  width: 100%;
  padding: 12px;
  margin: 10px 0;
  border-radius: 6px;
  border: 2px solid #ccc;
  font-size: 15px;
}

/* Botón */
button {
  width: 100%;
  padding: 14px;
  background: #000;
  color: #fff;
  border: none;
  border-radius: 6px;
  font-size: 16px;
  cursor: pointer;
  font-weight: bold;
  transition: 0.3s;
}

button:hover {
  background: #333;
}

/* Mensajes */
.status {
  margin-top: 15px;
  padding: 12px;
  border-radius: 6px;
  text-align: center;
  font-weight: bold;
}

.status.ok {
  background: #c8f7c5;
  color: #2e7d32;
}

.status.error {
  background: #f8d7da;
  color: #842029;
}
</style>
</head>

<body>

<div class="form-container">

  <div class="icon">
    <img src="https://cdn-icons-png.flaticon.com/512/2921/2921822.png">
  </div>

  <h2>Reserva tu turno</h2>

  <form id="bookingForm">
    <input type="text" id="nombre" placeholder="Nombre completo" required>
    <input type="text" id="telefono" placeholder="Teléfono" required>
    <input type="text" id="direccion" placeholder="Dirección" required>

    <label>Fecha:</label>
    <input type="date" id="fecha" required>

    <label>Hora:</label>
    <input type="time" id="hora" required>

    <label>Servicio:</label>
    <select id="servicio" required>
      <option value="Corte">Corte</option>
      <option value="Barba">Barba</option>
      <option value="Corte + Barba">Corte + Barba</option>
    </select>

    <button type="submit">Reservar turno</button>

    <div id="status" class="status"></div>
  </form>

</div>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxQQCWkTnxcvYBzPU5dBlsi4REaHx9zy8rTvPFcInVTkRvfE_whPfqCCQ087ZNQ0CTV/exec";

document.getElementById("bookingForm").addEventListener("submit", async (e) => {
  e.preventDefault();

  const status = document.getElementById("status");

  const data = {
    action: "create",
    nombre: document.getElementById("nombre").value,
    telefono: document.getElementById("telefono").value,
    direccion: document.getElementById("direccion").value,
    fecha: document.getElementById("fecha").value,
    hora: document.getElementById("hora").value,
    servicio: document.getElementById("servicio").value
  };

  const res = await fetch(SCRIPT_URL, {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "Accept": "text/plain"
    },
    body: JSON.stringify(data)
  });

  const txt = await res.text();

  if (txt === "YaReservado") {
    status.textContent = "Ya tienes una reserva para ese día.";
    status.className = "status error";
    return;
  }

  if (txt === "ReservaActiva") {
    status.textContent = "Ya tienes una reserva activa. Cancélala para crear otra.";
    status.className = "status error";
    return;
  }

  if (txt === "HoraOcupada") {
    status.textContent = "Ese horario ya está reservado.";
    status.className = "status error";
    return;
  }

  if (txt === "ServicioDuplicado") {
    status.textContent = "Ya reservaste este servicio para ese día.";
    status.className = "status error";
    return;
  }

  if (txt === "SemanaLimitada") {
    status.textContent = "Solo puedes reservar una vez por semana.";
    status.className = "status error";
    return;
  }

  if (txt === "OK") {
    status.textContent = "Turno reservado correctamente.";
    status.className = "status ok";
    document.getElementById("bookingForm").reset();
    return;
  }

  status.textContent = "Error inesperado.";
  status.className = "status error";
});
</script>

</body>
</html>
