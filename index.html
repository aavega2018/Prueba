<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Barbería El Estilo de Ángel</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      font-family: system-ui, sans-serif;
      background: #111;
      color: #f5f5f5;
      margin: 0;
      padding: 0;
    }
    header {
      text-align: center;
      padding: 2rem 1rem;
      background: linear-gradient(135deg, #111, #333);
      border-bottom: 1px solid #444;
    }
    h1 {
      margin: 0;
      font-size: 2rem;
      letter-spacing: 1px;
    }
    .subtitle {
      margin-top: .5rem;
      color: #bbb;
    }
    main {
      max-width: 600px;
      margin: 2rem auto;
      padding: 1.5rem;
      background: #1a1a1a;
      border-radius: 12px;
      border: 1px solid #333;
    }
    label {
      display: block;
      margin-top: 1rem;
      font-size: .9rem;
      color: #ddd;
    }
    input, select {
      width: 100%;
      padding: .6rem .7rem;
      margin-top: .3rem;
      border-radius: 6px;
      border: 1px solid #444;
      background: #111;
      color: #f5f5f5;
      box-sizing: border-box;
    }
    input:focus, select:focus {
      outline: none;
      border-color: #0f9d58;
    }
    .row {
      display: flex;
      gap: 1rem;
    }
    .row > div {
      flex: 1;
    }
    .note {
      font-size: .8rem;
      color: #999;
      margin-top: .3rem;
    }
    button {
      margin-top: 1.5rem;
      padding: .7rem 1.2rem;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      font-weight: 600;
    }
    .btn-primary {
      background: #0f9d58;
      color: #fff;
    }
    .btn-secondary {
      background: #444;
      color: #eee;
      margin-left: .5rem;
    }
    .status {
      margin-top: 1rem;
      font-size: .9rem;
    }
    .status.ok {
      color: #0f9d58;
    }
    .status.error {
      color: #ff5252;
    }
  </style>
</head>
<body>
  <header>
    <h1>Barbería El Estilo de Ángel</h1>
    <p class="subtitle">Reserva tu turno de 8:00 AM a 6:00 PM</p>
  </header>

  <main>
    <h2>Reservar turno</h2>
    <form id="bookingForm">
      <label>Nombre completo</label>
      <input type="text" id="nombre" required>

      <label>Teléfono (WhatsApp)</label>
      <input type="tel" id="telefono" required>

      <label>Dirección</label>
      <input type="text" id="direccion" required>

      <div class="row">
        <div>
          <label>Fecha</label>
          <input type="date" id="fecha" required>
        </div>
        <div>
          <label>Hora</label>
          <input type="time" id="hora" required>
          <div class="note">Solo entre 08:00 y 18:00</div>
        </div>
      </div>

      <label>Servicio</label>
      <select id="servicio" required>
        <option value="">Selecciona...</option>
        <option value="Corte de cabello">Corte de cabello</option>
        <option value="Barba">Barba</option>
        <option value="Corte + Barba">Corte + Barba</option>
      </select>

      <button type="submit" class="btn-primary">Reservar turno</button>
    </form>

    <h2 style="margin-top:2rem;">Cancelar turno</h2>
    <p class="note">Usa el ID de reserva que recibiste por WhatsApp o correo.</p>
    <form id="cancelForm">
      <label>ID de reserva</label>
      <input type="text" id="reservaId" required>
      <button type="submit" class="btn-secondary">Cancelar turno</button>
    </form>

    <div id="status" class="status"></div>
  </main>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyETM-kfbIkkrUqbg2kjZfHdGzY1ngPSiMBeWyKRXYiaMBfp2PFAimWQGGzHXiIeMSX/exec";

    function validarHora(horaStr) {
      // horaStr formato HH:MM
      const [h, m] = horaStr.split(":").map(Number);
      const totalMin = h * 60 + m;
      const min = 8 * 60;   // 08:00
      const max = 18 * 60;  // 18:00
      return totalMin >= min && totalMin <= max;
    }

    document.getElementById("bookingForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const status = document.getElementById("status");
      status.textContent = "";
      status.className = "status";

      const nombre = document.getElementById("nombre").value.trim();
      const telefono = document.getElementById("telefono").value.trim();
      const direccion = document.getElementById("direccion").value.trim();
      const fecha = document.getElementById("fecha").value;
      const hora = document.getElementById("hora").value;
      const servicio = document.getElementById("servicio").value;

      if (!validarHora(hora)) {
        status.textContent = "La hora debe estar entre 08:00 y 18:00.";
        status.classList.add("error");
        return;
      }

      const payload = {
        action: "create",
        nombre,
        telefono,
        direccion,
        fecha,
        hora,
        servicio
      };

      try {
        const res = await fetch(SCRIPT_URL, {
  method: "POST",
  headers: {
    "Content-Type": "text/plain;charset=utf-8"
  },
  body: JSON.stringify(payload)
});

        status.textContent = "Turno reservado. Recibirás confirmación por WhatsApp o correo.";
        status.classList.add("ok");
        document.getElementById("bookingForm").reset();
      } catch (err) {
        status.textContent = "Error al reservar. Intenta de nuevo más tarde.";
        status.classList.add("error");
      }
    });

    document.getElementById("cancelForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const status = document.getElementById("status");
      status.textContent = "";
      status.className = "status";

      const reservaId = document.getElementById("reservaId").value.trim();
      const payload = {
        action: "cancel",
        reservaId
      };

      try {
        const res = await fetch(SCRIPT_URL, {
  method: "POST",
  headers: {
    "Content-Type": "text/plain;charset=utf-8"
  },
  body: JSON.stringify(payload)
});


        status.textContent = "Turno cancelado (si el ID es válido).";
        status.classList.add("ok");
        document.getElementById("cancelForm").reset();
      } catch (err) {
        status.textContent = "Error al cancelar. Intenta de nuevo.";
        status.classList.add("error");
      }
    });
  </script>
</body>
</html>
